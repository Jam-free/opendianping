<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=375">
<title>美食肥猫 · v3 瑞士极简原型</title>
<style>
:root{--g:linear-gradient(90deg,#FF8A2B,#FF2D87);--line:#E6E6E6;--ink:#111;--sub:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f2f2f2;font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#app{width:375px;min-height:812px;margin:0 auto;background:#fff;position:relative;padding-bottom:110px}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:15px;font-weight:600}
.nav{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;gap:10px}
.nav a{color:var(--ink);text-decoration:none;font-size:22px;line-height:1;width:24px}
.seg{margin:8px auto 4px;width:240px;display:flex;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg a{flex:1;text-align:center;padding:8px 0;border-radius:9px;text-decoration:none;color:var(--ink);font-size:16px}
.seg a.on{background:var(--g);color:#fff;font-weight:600}
.demo{margin:6px 16px;font-size:11px;color:#999;border:1px dashed #ccc;padding:3px 8px;text-align:center}
.row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);gap:12px}
.dist{font-family:"Oswald","Barlow Condensed",sans-serif;font-weight:700;font-size:48px;line-height:1;width:120px;letter-spacing:-1px;flex:none}
.dist small{font-size:22px;margin-left:1px}
.dist.na{font-size:20px;color:#bbb;font-weight:500}
.info{min-width:0;flex:1}
.name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--sub);margin:3px 0 6px}
.avs{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.av{width:24px;height:24px;border-radius:50%;background:#EDEDED;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#333;font-weight:600;flex:none}
.av.lg{width:44px;height:44px;font-size:16px}
.rec{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.sec{font-size:12px;color:var(--sub);padding:18px 16px 6px;border-bottom:1px solid var(--line);letter-spacing:1px}
.bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:343px;height:64px;border-radius:32px;background:var(--g);display:flex;box-shadow:0 6px 18px rgba(255,60,110,.25);z-index:9}
.bar a{flex:1;color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;gap:2px}
.bar a+a{border-left:1px solid rgba(255,255,255,.4)}
.bar svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.pad{padding:16px}
h1{font-size:28px;font-weight:700;margin:4px 0 6px}
.p{font-size:14px;color:var(--sub);line-height:1.6}
.input{width:100%;border:1px solid var(--ink);border-radius:0;padding:12px;font-size:14px;min-height:88px;margin:14px 0;font-family:inherit;resize:none}
.btn{display:block;text-align:center;padding:14px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:15px;font-weight:600;margin-top:10px}
.btn.g{background:var(--g);border:0;color:#fff}
.foot{font-size:11px;color:#aaa;text-align:center;padding:18px 16px}
.big{font-family:"Oswald","Barlow Condensed",sans-serif;font-weight:700;font-size:96px;line-height:1}
.prog{height:2px;background:var(--line);margin:18px 0}.prog i{display:block;height:2px;width:60%;background:var(--g)}
.chk{width:20px;height:20px;border:1.5px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.chk.on{background:var(--g);border:0;color:#fff}
.note{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.note b{font-size:14px}.note p{font-size:14px;color:#333;margin-top:3px;line-height:1.5}
.kv{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}.kv span:first-child{color:var(--sub)}
.card{margin:16px;border:1px solid var(--line)}
.card .top{height:150px;background:var(--g);color:#fff;padding:18px}
.toast{margin:12px 16px;padding:10px;border-left:3px solid #FF2D87;font-size:13px;background:#fafafa}
</style></head><body><div id="app"></div>
<nav class="bar" id="bar">
<a href="#import"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg>导入</a>
<a href="#locate"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/></svg>记美食</a>
<a href="#invite"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>邀请</a>
</nav>
<script>
const F={w:{n:"小王"},y:{n:"阿云"},l:{n:"老李"},m:{n:"米粒"},z:{n:"周周"},k:{n:"可乐"}};
const S=[
{id:1,n:"示例·深海寿司屋",c:"日本料理 · 寿司",d:0.3,a:"示例市示例路 1 号",p:"¥120/人",r:["w","y","l","m","z"],no:{w:"三文鱼腩必点（示例备注）",y:"午市套餐划算",l:"排队约 20 分钟"}},
{id:2,n:"示例·手作意面",c:"意大利菜 · 意面",d:0.6,a:"示例市示例街 22 号",p:"¥88/人",r:["y","k"],no:{y:"黑松露意面（示例）",k:"环境安静"}},
{id:3,n:"示例·串烧居酒屋",c:"日式烤鸡 · 居酒屋",d:0.9,a:"示例市示例巷 8 号",p:"¥150/人",r:["l","w","m","z"],no:{l:"鸡心串好吃（示例）"}},
{id:4,n:"示例·小笼包铺",c:"中式 · 点心",d:1.2,a:"示例市示例大道 66 号",p:"¥45/人",r:["m"],no:{m:"蟹粉小笼（示例）"}},
{id:5,n:"示例·定食屋",c:"日本料理 · 定食",d:1.6,a:"示例市示例里 3 号",p:"¥60/人",r:["z","w","y"],no:{z:"鲭鱼定食（示例）"}},
{id:6,n:"示例·法式早午餐",c:"法国菜 · 早午餐",d:2.1,a:"示例市示例广场 B1",p:"¥110/人",r:["k","y","l","w"],no:{k:"可颂酥（示例）"}},
{id:7,n:"示例·跨城烧腊",c:"粤菜 · 烧腊",d:null,city:"示例城",a:"无坐标，来自专辑原文",p:"¥70/人",r:["l"],no:{l:"叉烧（示例）"}},
{id:8,n:"示例·无坐标面馆",c:"面馆",d:null,a:"无坐标",p:"",r:["w","y"],no:{w:"牛肉面（示例）"}}];
const dist=s=>s.d==null?`<div class="dist na">${s.city||"未知距离"}</div>`:s.d<1?`<div class="dist">${s.d*1000}<small>m</small></div>`:`<div class="dist">${s.d}<small>km</small></div>`;
const avs=r=>r.slice(0,3).map(k=>`<span class="av">${F[k].n[0]}</span>`).join("")+(r.length>3?`<span class="av">+${r.length-3}</span>`:"")+`<span class="rec">${r.slice(0,2).map(k=>F[k].n).join("、")}${r.length>2?"等 "+r.length+" 人":""}推荐</span>`;
const row=s=>`<a class="row" href="#shop-${s.id}">${dist(s)}<div class="info"><div class="name">${s.n}</div><div class="meta">${s.c}</div><div class="avs">${avs(s.r)}</div></div></a>`;
const list=arr=>{const a=arr.filter(s=>s.d!=null).sort((x,y)=>x.d-y.d),b=arr.filter(s=>s.d==null);return a.map(row).join("")+(b.length?`<div class="sec">无坐标的店</div>`+b.map(row).join(""):"")};
const st=`<div class="status"><span>9:41</span><span>●●● ▮</span></div>`;
const nav=(t,b="#home")=>st+`<div class="nav"><a href="${b}">‹</a>${t}</div>`;
const seg=o=>st+`<div class="seg"><a href="#home" class="${o==0?"on":""}">店铺</a><a href="#friends" class="${o==1?"on":""}">朋友</a></div><div class="demo">以下均为示例数据</div>`;
const R={
home:()=>seg(0)+list(S),
friends:()=>seg(1)+Object.entries(F).map(([k,f])=>`<a class="row" href="#friend-${k}"><span class="av lg">${f.n[0]}</span><div class="info"><div class="name">${f.n}（示例）</div><div class="meta">收藏 ${S.filter(s=>s.r.includes(k)).length} 家</div></div><span style="color:#bbb">›</span></a>`).join(""),
friend:k=>nav(F[k].n+" 的收藏","#friends")+`<div class="demo">示例数据 · 按离我距离排序</div>`+list(S.filter(s=>s.r.includes(k))),
shop:id=>{const s=S.find(x=>x.id==id);return nav("店铺详情")+`<div class="pad"><div class="big">${s.d==null?"—":s.d<1?s.d*1000+'<span style="font-size:40px">m</span>':s.d+'<span style="font-size:40px">km</span>'}</div><h1>${s.n}</h1><div class="p">${s.c}</div></div>
<div class="kv"><span>人均</span><span>${s.p||"—"}</span></div><div class="kv"><span>地址</span><span>${s.a}</span></div><div class="kv"><span>来源</span><span>点评专辑（示例链接）</span></div>
<div class="sec">${s.r.length} 位朋友的备注</div>`+s.r.map(k=>`<div class="note"><span class="av lg">${F[k].n[0]}</span><div><b>${F[k].n}</b><p>${s.no[k]||"未写备注"}</p></div></div>`).join("")+`<div class="pad"><a class="btn" href="#home">导航到这里（示例）</a></div>`},
import:()=>nav("导入专辑")+`<div class="pad"><h1>粘贴专辑链接</h1><div class="p">粘贴你在大众点评主动分享的公开专辑链接，只读取公开内容。</div><textarea class="input">https://example.com/示例专辑链接</textarea><a class="btn g" href="#import-loading">开始导入</a></div><div class="foot">与大众点评无官方合作关系</div>`,
"import-loading":()=>nav("导入中","#import")+`<div class="pad"><div class="big">12<span style="font-size:40px">/20</span></div><h1>正在识别店铺</h1><div class="prog"><i></i></div><div class="p">请稍候，读取频率受限以保护数据源。</div><a class="btn" href="#import-preview">查看已识别（示例）</a></div><div class="foot">与大众点评无官方合作关系</div>`,
"import-preview":()=>nav("勾选要保存的店","#import")+`<div class="demo">示例数据 · 已识别 4 家</div>`+S.slice(0,4).map((s,i)=>`<div class="row"><span class="chk ${i<3?"on":""}">${i<3?"✓":""}</span><div class="info"><div class="name">${s.n}</div><div class="meta">${s.c} · ${s.p}</div></div></div>`).join("")+`<div class="pad"><a class="btn g" href="#import-done">保存 3 家到圈子</a></div><div class="foot">与大众点评无官方合作关系</div>`,
"import-done":()=>nav("导入完成")+`<div class="pad"><div class="big">3</div><h1>家店已保存</h1><div class="p">圈友现在可以在首页看到它们。</div><a class="btn g" href="#home">回到首页</a></div><div class="foot">与大众点评无官方合作关系</div>`,
locate:()=>nav("定位记美食")+`<div class="demo">示例数据 · 附近的店</div>`+S.slice(0,4).map((s,i)=>`<a class="row" href="#locate-note-${s.id}">${dist(s)}<div class="info"><div class="name">${s.n}</div><div class="meta">${s.c}</div></div></a>`).join(""),
"locate-note":id=>{const s=S.find(x=>x.id==id);return nav("写备注","#locate")+`<div class="pad"><div class="big">${s.d*1000}<span style="font-size:40px">m</span></div><h1>${s.n}</h1><div class="p">${s.c}</div><textarea class="input" placeholder="写点推荐理由…">招牌菜很好吃（示例备注）</textarea><a class="btn g" href="#locate-done">保存</a></div>`},
"locate-done":()=>nav("已记录")+`<div class="toast">已保存，圈友可见（示例）</div>`+list(S.slice(0,3)),
invite:()=>nav("邀请加入圈子")+`<div class="card"><div class="top"><div style="font-size:13px;opacity:.9">美食肥猫 · 小程序</div><div style="font-size:24px;font-weight:700;margin-top:30px">来「示例饭搭子圈」<br>一起收藏好店</div></div><div class="kv" style="border:0"><span>示例圈 · 6 位成员</span><span>7 天内有效</span></div></div><div class="pad"><a class="btn g" href="#accept">分享到微信群</a><a class="btn" href="#accept">预览受邀页面</a></div>`,
accept:()=>st+`<div class="pad" style="padding-top:40px"><div class="p">小王（示例）邀请你加入</div><h1 style="font-size:34px">示例饭搭子圈</h1><div class="big">48<span style="font-size:32px"> 家店</span></div><div style="display:flex;gap:6px;margin:18px 0">${Object.values(F).map(f=>`<span class="av lg">${f.n[0]}</span>`).join("")}</div><div class="p">加入后，你能看到圈友设为共享的收藏；你的位置不会共享给圈友。</div><a class="btn g" href="#home">加入圈子</a><a class="btn" href="#home">暂不加入</a></div>`};
function go(){let h=location.hash.slice(1)||"home",m=h.match(/^(friend|shop|locate-note)-(\w+)$/);document.getElementById("app").innerHTML=m?R[m[1]](m[2]):(R[h]||R.home)();scrollTo(0,0)}
addEventListener("hashchange",go);go();
</script></body></html>
